name: 每月自動搜尋新競賽

on:
  schedule:
    - cron: '0 1 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '模擬執行（不實際修改檔案）'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  search-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install anthropic

      - name: 🔍 執行每月自動搜尋
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 monthly_search.py

      - name: 📊 讀取搜尋結果
        id: check_results
        run: |
          CHANGES=$(cat change_count.txt 2>/dev/null || echo "0")
          NEW=$(cat new_count.txt 2>/dev/null || echo "0")
          REMOVED=$(cat removed_count.txt 2>/dev/null || echo "0")
          echo "change_count=$CHANGES" >> $GITHUB_OUTPUT
          echo "new_count=$NEW" >> $GITHUB_OUTPUT
          echo "removed_count=$REMOVED" >> $GITHUB_OUTPUT
          echo "新增：$NEW 筆 | 移除：$REMOVED 筆"

      # 有變更 → 建立 Pull Request
      - name: 📬 建立 Pull Request
        if: steps.check_results.outputs.change_count != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🤖 每月自動更新：新增 ${{ steps.check_results.outputs.new_count }} 筆，移除 ${{ steps.check_results.outputs.removed_count }} 筆"
          branch: auto-update/monthly-${{ github.run_number }}
          delete-branch: true
          title: "🔍 每月自動更新：新增 ${{ steps.check_results.outputs.new_count }} 筆，移除 ${{ steps.check_results.outputs.removed_count }} 筆"
          body-path: pr_body.txt
          labels: |
            auto-update
            needs-review

      # 無變更 → 只在 Actions log 印出通知，不建立 Issue（避免權限問題）
      - name: 📭 無變更通知
        if: steps.check_results.outputs.change_count == '0'
        run: |
          echo "============================================"
          echo "📭 本月搜尋結果：無新競賽，也無過期競賽"
          echo "============================================"
          echo "執行時間：$(date '+%Y-%m-%d %H:%M:%S')"
          echo "下次執行：下個月 1 號"
          echo "如需手動新增，請至 Claude.ai 搜尋後更新"
          echo "============================================"
